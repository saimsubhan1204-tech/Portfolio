<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Esha 🎀</title>
<style>
  :root{
    box-sizing:border-box;
    --pink-1:#ffe4ef;
    --pink-2:#ffc2dd;
    --pink-3:#ff8fc7;
    --pink-4:#ff5da2;
    --pink-deep:#d6337a;
    --white:#fffafc;
    --text:#7a2350;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    height:100%;
    margin:0;
    font-family:'Segoe UI', 'Poppins', sans-serif;
    background:linear-gradient(160deg,var(--pink-1),var(--pink-2) 40%,var(--pink-3) 100%);
    color:var(--text);
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    position:relative;
  }

  /* Floating balloons */
  .balloon{
    position:fixed;
    bottom:-150px;
    width:60px;
    height:75px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity:0.85;
    animation:floatUp linear infinite;
    z-index:1;
  }
  .balloon::after{
    content:'';
    position:absolute;
    left:50%;
    bottom:-40px;
    width:2px;
    height:40px;
    background:rgba(122,35,80,0.4);
    transform:translateX(-50%);
  }
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0) rotate(0deg);}
    50%{transform:translateY(-55vh) translateX(20px) rotate(5deg);}
    100%{transform:translateY(-115vh) translateX(-10px) rotate(-5deg);}
  }

  .card{
    position:relative;
    z-index:5;
    background:rgba(255,250,252,0.9);
    backdrop-filter:blur(6px);
    border-radius:28px;
    padding:40px 28px 34px;
    max-width:420px;
    width:90%;
    text-align:center;
    box-shadow:0 20px 50px rgba(214,51,122,0.25), 0 0 0 6px rgba(255,255,255,0.6) inset;
    border:2px solid var(--pink-3);
    opacity:0;
    transform:scale(0.4) translateY(60px) rotate(-6deg);
    display:none;
  }
  .card.reveal{
    display:block;
    animation:card-burst 1s cubic-bezier(.22,1.6,.4,1) forwards;
  }
  @keyframes card-burst{
    0%{opacity:0; transform:scale(0.3) translateY(80px) rotate(-10deg);}
    55%{opacity:1; transform:scale(1.08) translateY(-10px) rotate(3deg);}
    75%{transform:scale(0.96) translateY(4px) rotate(-1deg);}
    100%{opacity:1; transform:scale(1) translateY(0) rotate(0deg);}
  }

  .cake{
    font-size:64px;
    display:inline-block;
    animation:wiggle 2.4s ease-in-out infinite;
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(-6deg);}
    50%{transform:rotate(6deg);}
  }

  h1{
    font-size:clamp(24px,6vw,34px);
    margin:14px 0 4px;
    color:var(--pink-deep);
    text-shadow:1px 1px 0 #fff;
  }
  .title-anim{
    display:inline-block;
    animation:title-glow 1.8s ease-in-out infinite;
  }
  @keyframes title-glow{
    0%,100%{text-shadow:1px 1px 0 #fff, 0 0 0 rgba(255,93,162,0);}
    50%{text-shadow:1px 1px 0 #fff, 0 0 18px rgba(255,93,162,0.55);}
  }
  .sparkle-text{
    font-size:18px;
    margin:0 0 18px;
    color:var(--text);
    opacity:0.85;
  }

  #wishBox{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height 0.8s ease, opacity 0.8s ease, margin 0.8s ease;
    margin-top:0;
  }
  #wishBox.show{
    max-height:400px;
    opacity:1;
    margin-top:18px;
  }
  #wishBox p{
    font-size:16.5px;
    line-height:1.7;
    background:linear-gradient(135deg,#fff0f7,#ffe0ef);
    border-radius:16px;
    padding:18px;
    border:1px dashed var(--pink-4);
    margin:0;
    min-height:130px;
    text-align:left;
  }
  #wishText{
    white-space:pre-wrap;
  }
  .caret{
    display:inline-block;
    width:2px;
    height:1em;
    background:var(--pink-deep);
    margin-left:2px;
    vertical-align:middle;
    animation:blink 0.8s step-end infinite;
  }
  @keyframes blink{
    50%{opacity:0;}
  }

  button{
    border:none;
    outline:none;
    cursor:pointer;
    padding:14px 34px;
    font-size:17px;
    font-weight:600;
    color:#fff;
    border-radius:999px;
    background:linear-gradient(135deg,var(--pink-3),var(--pink-deep));
    box-shadow:0 8px 20px rgba(214,51,122,0.45);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  button#wishBtn{
    margin-top:22px;
    animation:pulse 2s ease-in-out infinite;
  }
  button:active{
    transform:scale(0.94);
  }
  button:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 26px rgba(214,51,122,0.55);
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 8px 20px rgba(214,51,122,0.45);}
    50%{box-shadow:0 8px 28px rgba(255,93,162,0.75);}
  }

  .hearts{
    margin-top:16px;
    font-size:22px;
    opacity:0.9;
  }
  .hearts span{
    display:inline-block;
    animation:beat 1.2s ease-in-out infinite;
  }
  .hearts span:nth-child(2){animation-delay:0.2s;}
  .hearts span:nth-child(3){animation-delay:0.4s;}
  @keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.3);}
  }

  canvas#confetti{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    pointer-events:none;
    z-index:10;
  }

  /* Overlay screens shared style */
  .overlay{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(160deg,var(--pink-2),var(--pink-3) 60%,var(--pink-4) 100%);
    padding:20px;
    transition:opacity 0.6s ease, visibility 0.6s ease;
  }
  .overlay.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .overlay-card{
    background:rgba(255,250,252,0.95);
    border-radius:24px;
    padding:36px 26px;
    max-width:360px;
    width:90%;
    text-align:center;
    box-shadow:0 20px 50px rgba(214,51,122,0.3);
    border:2px solid var(--pink-3);
    animation:pop-in 0.7s cubic-bezier(.26,1.4,.44,1) both;
  }
  @keyframes pop-in{
    0%{transform:scale(0.6) translateY(40px);opacity:0;}
    100%{transform:scale(1) translateY(0);opacity:1;}
  }
  .overlay-card .emoji{
    font-size:46px;
    margin-bottom:6px;
    animation:wiggle 2s ease-in-out infinite;
  }
  .overlay-card h2{
    color:var(--pink-deep);
    margin:6px 0 4px;
    font-size:21px;
  }
  .overlay-card p{
    font-size:14px;
    opacity:0.75;
    margin:0 0 18px;
  }
  #passInput{
    width:100%;
    padding:13px 16px;
    border-radius:14px;
    border:2px solid var(--pink-3);
    font-size:16px;
    text-align:center;
    outline:none;
    margin-bottom:10px;
    background:#fff;
    color:var(--text);
  }
  #passInput:focus{
    border-color:var(--pink-deep);
  }
  .overlay-card button{
    width:100%;
    margin-top:2px;
  }
  #gateError{
    color:var(--pink-deep);
    font-size:13px;
    margin-top:10px;
    min-height:16px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --text:#5c1638;
    }
  }
</style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <!-- Password gate -->
  <div class="overlay" id="gate">
    <div class="overlay-card">
      <div class="emoji">🔒</div>
      <h2>Private Surprise</h2>
      <p>Enter the password to unlock Esha's birthday surprise 💗</p>
      <input type="password" id="passInput" placeholder="Password" autocomplete="off">
      <button id="gateBtn">Unlock 🎀</button>
      <div id="gateError"></div>
    </div>
  </div>

  <!-- Are you ready screen -->
  <div class="overlay hidden" id="readyScreen">
    <div class="overlay-card">
      <div class="emoji">🎁</div>
      <h2>Are you ready for the surprise?</h2>
      <p>Something special is waiting for you...</p>
      <button id="readyBtn">Yes! 🎉</button>
    </div>
  </div>

  <div class="card" id="mainCard">
    <div class="cake">🎂</div>
    <h1><span class="title-anim">Happy Birthday, Esha! 🎀💗</span></h1>
    <p class="sparkle-text">Today is extra special, because you are special ✨</p>

    <button id="wishBtn">Open Your Wish 🎁</button>

    <div id="wishBox">
      <p><span id="wishText"></span><span class="caret" id="caret"></span></p>
    </div>

    <div class="hearts">
      <span>💗</span><span>💕</span><span>💖</span>
    </div>
  </div>

<script>
  const colors = ['#ff8fc7','#ff5da2','#ffb6d9','#ffd1e8','#ff6fb0'];

  // ---- Password gate ----
  const CORRECT_PASSWORD = "ESHA"; // change this to whatever password you like
  const gate = document.getElementById('gate');
  const readyScreen = document.getElementById('readyScreen');
  const passInput = document.getElementById('passInput');
  const gateBtn = document.getElementById('gateBtn');
  const gateError = document.getElementById('gateError');
  const readyBtn = document.getElementById('readyBtn');
  const mainCard = document.getElementById('mainCard');

  function tryUnlock(){
    if(passInput.value.trim().toUpperCase() === CORRECT_PASSWORD){
      gate.classList.add('hidden');
      gateError.textContent = '';
      setTimeout(()=> readyScreen.classList.remove('hidden'), 350);
    } else {
      gateError.textContent = 'Incorrect password, try again 💔';
      passInput.value = '';
      passInput.focus();
    }
  }
  gateBtn.addEventListener('click', tryUnlock);
  passInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') tryUnlock();
  });

  // ---- Ready screen -> reveal main card ----
  readyBtn.addEventListener('click', ()=>{
    readyScreen.classList.add('hidden');
    setTimeout(()=>{
      mainCard.classList.add('reveal');
      startBalloons();
      burstConfetti();
    }, 300);
  });

  // ---- Floating balloons (only start after surprise begins) ----
  let balloonsRunning = false;
  function spawnBalloon(){
    const b = document.createElement('div');
    b.className = 'balloon';
    b.style.left = Math.random()*94 + '%';
    b.style.background = colors[Math.floor(Math.random()*colors.length)];
    const duration = 8 + Math.random()*6;
    b.style.animationDuration = duration + 's';
    b.style.width = (45 + Math.random()*30) + 'px';
    b.style.height = (parseFloat(b.style.width) * 1.25) + 'px';
    document.body.appendChild(b);
    setTimeout(()=> b.remove(), duration*1000 + 200);
  }
  function startBalloons(){
    if(balloonsRunning) return;
    balloonsRunning = true;
    setInterval(spawnBalloon, 900);
    for(let i=0;i<6;i++) setTimeout(spawnBalloon, i*300);
  }

  // ---- Wish reveal with typewriter animation ----
  const wishFullText = "Dear Esha, your smile makes this day even brighter, and your presence makes every moment feel a little more special.\n\nOn this birthday, I hope you take a moment to look back and see how far you've come, and how proud you should be of yourself. You deserve every good thing this new year has to offer.\n\nMay your days be filled with laughter that never fades, friendships that never break, and dreams that keep getting bigger. May you find success in everything you chase, peace in everything you do, and love in everyone around you.\n\nHere's to another year of you being amazing, chasing your goals, making beautiful memories, and lighting up every room you walk into.\n\nHappy Birthday, Esha! Wishing you all the happiness in the world today and always. 🎂💗";
  const btn = document.getElementById('wishBtn');
  const wishBox = document.getElementById('wishBox');
  const wishTextEl = document.getElementById('wishText');
  let opened = false;
  let typing = false;

  function typeWriter(text, el, speed){
    return new Promise(resolve=>{
      let i = 0;
      el.textContent = '';
      const timer = setInterval(()=>{
        el.textContent += text.charAt(i);
        i++;
        if(i >= text.length){
          clearInterval(timer);
          resolve();
        }
      }, speed);
    });
  }

  btn.addEventListener('click', async ()=>{
    burstConfetti();
    if(!opened){
      opened = true;
      wishBox.classList.add('show');
      btn.textContent = 'Happy Birthday! 🎉';
      if(!typing){
        typing = true;
        await typeWriter(wishFullText, wishTextEl, 28);
        typing = false;
      }
    }
  });

  // ---- Confetti canvas ----
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let particles = [];
  function burstConfetti(){
    const count = 90;
    const cx = window.innerWidth/2;
    const cy = window.innerHeight*0.35;
    for(let i=0;i<count;i++){
      particles.push({
        x: cx,
        y: cy,
        vx: (Math.random()-0.5)*14,
        vy: Math.random()*-10 - 4,
        g: 0.35 + Math.random()*0.15,
        size: 5 + Math.random()*5,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*360,
        vr: (Math.random()-0.5)*10,
        life: 120 + Math.random()*40
      });
    }
  }

  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life--;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    });
    particles = particles.filter(p=> p.life > 0 && p.y < window.innerHeight+50);
    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
